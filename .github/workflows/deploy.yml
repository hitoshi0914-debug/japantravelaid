# main にマージされたら自動で Cloudflare に公開する（npm run deploy と同じ）。
# 必要な設定: GitHub の Settings > Secrets and variables > Actions に
# CLOUDFLARE_API_TOKEN（Cloudflare の「Edit Cloudflare Workers」テンプレートで作った API トークン）。
# 手動で公開し直したいときは Actions タブ > Deploy > Run workflow。
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # japanrockbar と同じ Cloudflare アカウント。
          CLOUDFLARE_ACCOUNT_ID: cc2d7d905379f8bfe3810ba800cac21c
