name: Probe clubjt
on:
  push:
    branches: [probe-clubjt]
permissions:
  contents: write
jobs:
  probe:
    if: "!contains(github.event.head_commit.message, 'probe result')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - run: |
          cp scripts/probe/clubjt.mjs /tmp/pw/ && cd /tmp/pw && node clubjt.mjs || true
          cp -r /tmp/pw/probe/* "$GITHUB_WORKSPACE/probe/" 2>/dev/null || true
      - run: |
          curl -sSL "https://www.clubjt.jp/map/main.e5b2f8b596b63f88.js" -o probe/main.js || true
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "probe result" && git push
