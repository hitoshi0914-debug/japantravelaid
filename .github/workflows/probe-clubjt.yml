name: Probe clubjt
on:
  push:
    branches: [probe-clubjt]
permissions:
  contents: write
jobs:
  probe:
    if: "!contains(github.event.head_commit.message, 'probe result')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          UA="Mozilla/5.0 (JapanTravelAid/1.0; +https://japantravelaid.com/)"
          curl -sSL -A "$UA" https://www.clubjt.jp/robots.txt -o probe/robots.txt || true
          curl -sSL -A "$UA" "https://www.clubjt.jp/map/?date=20261023" -o probe/map.html || true
          npm i --no-save playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > probe.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const b = await chromium.launch();
          const ctx = await b.newContext({ geolocation: { latitude: 35.6896, longitude: 139.7006 }, permissions: ['geolocation'], locale: 'ja-JP' });
          const p = await ctx.newPage();
          const log = [];
          p.on('response', async (r) => {
            const u = r.url(); const ct = r.headers()['content-type'] || '';
            const e = { url: u, status: r.status(), ct, method: r.request().method(), post: r.request().postData()?.slice(0, 500) };
            if (/json|javascript/.test(ct) && !/googletag|google-analytics|gtm/.test(u)) {
              try { const t = await r.text(); e.size = t.length; if (/json/.test(ct)) e.sample = t.slice(0, 3000); } catch {}
            }
            log.push(e);
          });
          await p.goto('https://www.clubjt.jp/map/?date=20261023', { waitUntil: 'networkidle', timeout: 60000 });
          await p.waitForTimeout(8000);
          await p.screenshot({ path: 'probe/map.png', fullPage: false });
          fs.writeFileSync('probe/requests.json', JSON.stringify(log, null, 1));
          fs.writeFileSync('probe/rendered.html', await p.content());
          await b.close();
          JS
          node probe.mjs || true
          ls -la probe
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "probe result" && git push
