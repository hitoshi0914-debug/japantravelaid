name: Probe town-coupon
on:
  push:
    branches: [probe-town-coupon]
permissions:
  contents: write
jobs:
  probe:
    if: "!contains(github.event.head_commit.message, 'probe result')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/smoking/fetch_town_coupon.py --max-details 40 --out probe_town_coupon.json 2>&1 | tee probe_log.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add probe_town_coupon.json probe_log.txt && git commit -m "probe result" && git push
