name: Probe clubjt zoom
on:
  push:
    branches: [probe-clubjt2]
permissions:
  contents: write
jobs:
  probe:
    if: github.event.head_commit.message != 'probe result'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe/clubjt_zoom.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add probe_out.json && git commit -qm "probe result" && git push
