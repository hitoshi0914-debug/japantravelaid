# Android アプリ（Capacitor）をビルドして、試し用の APK を Actions の「Artifacts」に置く。
# スマホで Actions > Android app > いちばん上の実行 > Artifacts の japan-travel-aid-debug をダウンロードして入れられる。
# ストア提出用（署名した AAB）は Google Play の登録が済んでから足す。
name: Android app

on:
  pull_request:
    paths: ['android/**', 'capacitor.config.ts', 'package.json', 'package-lock.json', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # サイトをアプリ用（広告・寄付・GA なし）にビルドして android/ に写す。
      - run: npm run build:app
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: japan-travel-aid-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # ストア提出用: 手動実行のときだけ。versionCode は実行番号（ストアに出すたびに増える必要がある）。
      - if: github.event_name == 'workflow_dispatch'
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-key.p12"
          ./gradlew bundleRelease
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload-key.p12
          VERSION_CODE: ${{ github.run_number }}
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: japan-travel-aid-release
          path: android/app/build/outputs/bundle/release/app-release.aab
